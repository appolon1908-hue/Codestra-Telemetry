name: Validate Telemetry repository authority

on:
  pull_request:
  push:
    branches: [development, test, staging, production, main]

permissions:
  contents: read

jobs:
  validate-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.event.pull_request.head.sha }}", fetch-depth: 0, persist-credentials: false}
      - name: Validate exact source authority
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          python3 scripts/validate_repository_authority.py
          python3 -m unittest discover -s tests -p 'test_repository_authority.py'
          git diff --check "$BASE_SHA" "$HEAD_SHA"
      - name: Scan exact repository with redacted output
        run: |
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact=100 --exit-code 1 .

  validate-merge-result:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {fetch-depth: 0, persist-credentials: false}
      - run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/validate_repository_authority.py
          python3 -m unittest discover -s tests -p 'test_repository_authority.py'

  validate-protected:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with: {ref: "${{ github.sha }}", fetch-depth: 0, persist-credentials: false}
      - run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/validate_repository_authority.py
          python3 -m unittest discover -s tests -p 'test_repository_authority.py'
