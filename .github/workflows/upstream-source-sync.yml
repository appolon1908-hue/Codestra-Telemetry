name: Codestra Upstream Source Sync

on:
  push:
    branches: [main]
    paths:
      - CODESTRA_UPSTREAM.json
      - CODESTRA_UPSTREAM_LOCK.json
      - upstream/**
      - .github/workflows/upstream-source-sync.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codestra-upstream-source-sync
  cancel-in-progress: false

jobs:
  detect-drift:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout Codestra authority
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect upstream drift without changing protected branches
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_repository_authority.py
          mapfile -t values < <(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('CODESTRA_UPSTREAM.json').read_text())
          print(data['upstream_clone_url'])
          print(data['upstream_ref'])
          print(data['import_path'])
          PY
          )
          UPSTREAM_URL="${values[0]}"
          UPSTREAM_REF="${values[1]}"
          IMPORT_PATH="${values[2]}"
          test "$UPSTREAM_URL" = "https://github.com/open-telemetry/opentelemetry-collector.git"
          test "$UPSTREAM_REF" = "main"
          test "$IMPORT_PATH" = "upstream"
          upstream_sha="$(git ls-remote "$UPSTREAM_URL" "refs/heads/$UPSTREAM_REF" | awk 'NR == 1 {print $1}')"
          locked_sha="$(python3 -c 'import json; print(json.load(open("CODESTRA_UPSTREAM_LOCK.json"))["upstream_commit"])')"
          locked_tree="$(python3 -c 'import json; print(json.load(open("CODESTRA_UPSTREAM_LOCK.json"))["imported_tree_sha"])')"
          [[ "$upstream_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$locked_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$locked_tree" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD:upstream)" = "$locked_tree"
          git fetch --no-tags --depth=1 --filter=blob:none "$UPSTREAM_URL" "$locked_sha"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "$locked_tree"
          if [[ "$upstream_sha" != "$locked_sha" ]]; then
            echo 'Upstream drift detected. Import it on a feature branch and use a reviewed protected-lineage PR.' >&2
            exit 1
          fi
          echo 'UPSTREAM_SOURCE_LOCK=PASS'
