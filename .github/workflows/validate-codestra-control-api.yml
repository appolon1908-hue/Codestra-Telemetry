name: Validate Codestra observability control API

on:
  pull_request:
    paths:
      - 'codestra/api/**'
      - 'codestra/control-api/**'
      - 'docs/CODESTRA-SERVICE-API.md'
      - 'scripts/validate_codestra_control_api.py'
      - '.github/workflows/reusable-validate-service-contract.yml'
      - '.github/workflows/validate-codestra-control-api.yml'
      - '.github/workflows/validate-codestra-service-contract.yml'
  push:
    branches: [development, test, staging, production, main, 'feature/**']
    paths:
      - 'codestra/api/**'
      - 'codestra/control-api/**'
      - 'docs/CODESTRA-SERVICE-API.md'
      - 'scripts/validate_codestra_control_api.py'
      - '.github/workflows/reusable-validate-service-contract.yml'
      - '.github/workflows/validate-codestra-control-api.yml'
      - '.github/workflows/validate-codestra-service-contract.yml'

permissions:
  contents: read

concurrency:
  group: codestra-control-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-control-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.23.x'
          cache: false

      - name: Validate registry, OpenAPI, and source safety
        env:
          PYTHONPYCACHEPREFIX: /tmp/codestra-control-api-pycache
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          python -m py_compile scripts/validate_codestra_control_api.py
          python scripts/validate_codestra_control_api.py

      - name: Test and compile the read-only API
        working-directory: codestra/control-api
        run: |
          gofmt -d . | tee /tmp/gofmt.diff
          test ! -s /tmp/gofmt.diff
          go test -race ./...
          go vet ./...
          CGO_ENABLED=0 go build -trimpath ./cmd/codestra-observability-api

      - name: Confirm no embedded credentials or mutable runtime activation
        run: |
          ! grep -RInE --exclude='*.md' '(BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,})' codestra/api codestra/control-api scripts/validate_codestra_control_api.py
          ! grep -RInE 'runtimeActivationAuthorized[^f]*true|mutationProxyEnabled[^f]*true|secretValueReadbackEnabled[^f]*true' codestra/api codestra/control-api
