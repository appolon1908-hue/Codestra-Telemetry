name: Validate protected reusable configuration release authority

on:
  push:
    branches: [development, test, staging, production, main]
    paths:
      - .github/workflows/reusable-release-config-bundle.yml
      - scripts/validate_reusable_config_release.py
      - tests/test_reusable_config_release.py

permissions:
  contents: read

jobs:
  validate-protected:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/validate_reusable_config_release.py
          python3 -m unittest discover -s tests -p 'test_reusable_config_release.py'
