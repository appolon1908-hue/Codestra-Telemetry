name: Controlled intake staging activation preparation gate
on:
  pull_request:
    paths: ["integration/staging-activation-contract-v1.json", ".github/workflows/controlled-intake-staging-activation-gate.yml"]
  workflow_dispatch:
    inputs:
      execution_reason: {description: "Why is this integration being executed?", required: true, type: string}
      change_id: {description: "Approved staging certification identifier", required: true, type: string}
      expected_branch_head: {description: "Exact 40-character branch SHA", required: true, type: string}
      middleware_image_digest: {description: "Immutable Middleware digest sha256:<64 hex>", required: true, type: string}
      staging_evidence_checksum: {description: "Passing evidence checksum sha256:<64 hex>", required: true, type: string}
      confirm_prometheus_only: {description: "Only Prometheus may later move pending to active", required: true, type: boolean}
      confirm_blackbox_pending: {description: "Blackbox remains pending", required: true, type: boolean}
      confirm_no_external_effects: {description: "No external or production effect", required: true, type: boolean}
permissions: {contents: read}
concurrency:
  group: controlled-intake-staging-activation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-preparation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          d=json.loads(Path('integration/staging-activation-contract-v1.json').read_text())
          assert d['schema_version']=='1.0' and d['suite_id']=='codestra-controlled-intake-monitoring-v1' and d['repository']==os.environ['GITHUB_REPOSITORY']
          assert d['execution_question']=='Why is this integration being executed?' and d['execution_reason_required'] is True and d['source_only_preparation'] is True
          s=d['middleware_source_authority']; assert s['repository']=='appolon1908-hue/Middleware-' and re.fullmatch(r'[0-9a-f]{40}',s['source_sha']) and s['immutable_image_digest'] is None and s['image_digest_state']=='PENDING_VERIFIED_IMMUTABLE_BUILD'
          e={(x['method'],x['path'],x['scope']) for x in d['private_endpoints']}; assert ('GET','/metrics','metrics.read') in e and ('GET','/v1/runtime/safety','health.read') in e
          assert all(x['client_id']=='monitoring-readonly' and x['public_exposure'] is False for x in d['private_endpoints'])
          c=d['staging_credentials']; assert c['storage']=='OUTSIDE_GIT' and c['static_tokens_allowed'] is False and c['secret_values_committed'] is False and 60<=c['minimum_token_ttl_seconds']<=c['maximum_token_ttl_seconds']<=900
          v=d['staging_evidence']; assert v['collector_repository']=='appolon1908-hue/Codestra-Prometheus' and v['checksum'] is None and v['state']=='PENDING_RUNTIME_EXECUTION'
          p=d['activation_policy']; assert p['prometheus_target_current_state']=='pending' and p['prometheus_target_allowed_next_state']=='active' and p['only_prometheus_target_may_transition'] is True and p['prometheus_activation_pr_required'] is True and p['prometheus_activation_pr_must_cite_image_digest'] is True and p['prometheus_activation_pr_must_cite_evidence_checksum'] is True
          assert p['blackbox_target_current_state']=='pending' and p['blackbox_must_remain_pending'] is True and p['blackbox_activation_requires_independent_review'] is True and p['blackbox_probe_must_be_side_effect_free'] is True and p['blackbox_allowed_methods']==['GET','HEAD'] and p['production_activation_authorized'] is False
          assert all(x is False for x in d['runtime_effects'].values())
          print('CONTROLLED_STAGING_ACTIVATION_PREPARATION=PASS')
          PY
  verify-evidence-inputs:
    if: github.event_name == 'workflow_dispatch'
    needs: validate-preparation-contract
    runs-on: ubuntu-latest
    env:
      EXECUTION_REASON: ${{ inputs.execution_reason }}
      CHANGE_ID: ${{ inputs.change_id }}
      EXPECTED_BRANCH_HEAD: ${{ inputs.expected_branch_head }}
      MIDDLEWARE_IMAGE_DIGEST: ${{ inputs.middleware_image_digest }}
      STAGING_EVIDENCE_CHECKSUM: ${{ inputs.staging_evidence_checksum }}
      CONFIRM_PROMETHEUS_ONLY: ${{ inputs.confirm_prometheus_only }}
      CONFIRM_BLACKBOX_PENDING: ${{ inputs.confirm_blackbox_pending }}
      CONFIRM_NO_EXTERNAL_EFFECTS: ${{ inputs.confirm_no_external_effects }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          python3 - <<'PY'
          import os,re,subprocess
          assert len(' '.join(os.environ['EXECUTION_REASON'].split()))>=40
          assert re.fullmatch(r'CHG-[A-Z0-9][A-Z0-9._-]{7,}',os.environ['CHANGE_ID'].strip().upper())
          expected=os.environ['EXPECTED_BRANCH_HEAD'].strip().lower(); assert re.fullmatch(r'[0-9a-f]{40}',expected); assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==expected
          pat=r'sha256:[0-9a-f]{64}'; assert re.fullmatch(pat,os.environ['MIDDLEWARE_IMAGE_DIGEST'].strip().lower()) and re.fullmatch(pat,os.environ['STAGING_EVIDENCE_CHECKSUM'].strip().lower())
          assert all(os.environ[n].lower()=='true' for n in ('CONFIRM_PROMETHEUS_ONLY','CONFIRM_BLACKBOX_PENDING','CONFIRM_NO_EXTERNAL_EFFECTS'))
          print('CONTROLLED_STAGING_EVIDENCE_REFERENCES=PASS')
          PY
