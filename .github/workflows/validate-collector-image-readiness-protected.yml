name: Validate protected Collector image readiness

on:
  push:
    branches: [development, test, staging, production, main]

permissions:
  contents: read

jobs:
  validate-protected:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Validate exact protected source
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install --disable-pip-version-check --no-cache-dir -r requirements-validation.txt
          python3 scripts/validate_codestra_collector.py
          python3 scripts/validate_collector_image_readiness.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build and inspect exact protected Collector image
        run: bash scripts/build_and_inspect_collector_image.sh "$GITHUB_SHA"
