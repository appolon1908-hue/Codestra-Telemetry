name: Validate Codestra corporate suite compatibility

on:
  pull_request:
    paths:
      - 'codestra/suite-contract.v1.json'
      - 'codestra/docs/SUITE-COMPATIBILITY-GATE.md'
      - 'scripts/validate_codestra_suite_contract.py'
      - '.github/workflows/validate-codestra-suite-compatibility.yml'
  push:
    branches: [development, test, staging, production, main]
    paths:
      - 'codestra/suite-contract.v1.json'
      - 'codestra/docs/SUITE-COMPATIBILITY-GATE.md'
      - 'scripts/validate_codestra_suite_contract.py'
      - '.github/workflows/validate-codestra-suite-compatibility.yml'

permissions:
  contents: read

concurrency:
  group: codestra-suite-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'

      - name: Compile and validate the twelve-product source contract
        env:
          PYTHONPYCACHEPREFIX: /tmp/codestra-suite-pycache
        run: |
          python -m py_compile scripts/validate_codestra_suite_contract.py
          python scripts/validate_codestra_suite_contract.py

      - name: Confirm source-only milestone language
        run: |
          grep -q 'CODESTRA_CORPORATE_SUITE_SOURCE_READY_FOR_STAGING_REVIEW' codestra/suite-contract.v1.json
          grep -q 'SOURCE_COMPATIBILITY_REVIEW_PENDING' codestra/suite-contract.v1.json
          ! grep -Eq '"(deploymentEnabled|nativePublicExposureEnabled|productionTelemetryIngestionEnabled|prometheusScrapingActivated|syntheticProbesActivated|grafanaBusinessAccessEnabled|supersetBusinessAccessEnabled|openBaoInitialized|openBaoPoliciesApplied|communicationsDeliveryEnabled|businessWritesEnabled|financialTradingAuthorityEnabled)"[[:space:]]*:[[:space:]]*true' codestra/suite-contract.v1.json
