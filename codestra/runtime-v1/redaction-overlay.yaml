processors:
  transform/codestra_redaction:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - delete_key(attributes, "http.request.header.authorization")
          - delete_key(attributes, "http.request.header.cookie")
          - delete_key(attributes, "http.response.header.set-cookie")
          - delete_key(attributes, "rpc.request.metadata.authorization")
          - delete_key(attributes, "db.statement.raw")
          - delete_key(attributes, "db.query.text.raw")
          - delete_key(attributes, "messaging.message.body")
          - delete_key(attributes, "email.body")
          - delete_key(attributes, "sms.body")
          - delete_key(attributes, "call.recording")
          - delete_key(attributes, "enduser.email")
          - delete_key(attributes, "enduser.phone")
          - delete_key(attributes, "user.password")
          - delete_key(attributes, "oauth.access_token")
          - delete_key(attributes, "oauth.refresh_token")
          - delete_key(attributes, "api.key")
          - delete_key(attributes, "private.key")
          - delete_key(attributes, "credit.report.raw")
          - delete_key(attributes, "government.identifier")
          - delete_key(attributes, "payment.card.number")
          - delete_key(attributes, "bank.account.number")
          - delete_key(attributes, "broker.api_secret")
          - delete_key(attributes, "broker.signing_key")
          - delete_key(attributes, "trade.authorization")
      - context: spanevent
        statements:
          - delete_key(attributes, "http.request.header.authorization")
          - delete_key(attributes, "http.request.header.cookie")
          - delete_key(attributes, "http.response.header.set-cookie")
          - delete_key(attributes, "db.statement.raw")
          - delete_key(attributes, "messaging.message.body")
          - delete_key(attributes, "email.body")
          - delete_key(attributes, "sms.body")
          - delete_key(attributes, "user.password")
          - delete_key(attributes, "oauth.access_token")
          - delete_key(attributes, "oauth.refresh_token")
          - delete_key(attributes, "api.key")
          - delete_key(attributes, "private.key")
          - delete_key(attributes, "broker.api_secret")
          - delete_key(attributes, "broker.signing_key")
          - delete_key(attributes, "trade.authorization")
    log_statements:
      - context: log
        statements:
          - delete_key(attributes, "http.request.header.authorization")
          - delete_key(attributes, "http.request.header.cookie")
          - delete_key(attributes, "http.response.header.set-cookie")
          - delete_key(attributes, "rpc.request.metadata.authorization")
          - delete_key(attributes, "db.statement.raw")
          - delete_key(attributes, "db.query.text.raw")
          - delete_key(attributes, "messaging.message.body")
          - delete_key(attributes, "email.body")
          - delete_key(attributes, "sms.body")
          - delete_key(attributes, "call.recording")
          - delete_key(attributes, "enduser.email")
          - delete_key(attributes, "enduser.phone")
          - delete_key(attributes, "user.password")
          - delete_key(attributes, "oauth.access_token")
          - delete_key(attributes, "oauth.refresh_token")
          - delete_key(attributes, "api.key")
          - delete_key(attributes, "private.key")
          - delete_key(attributes, "credit.report.raw")
          - delete_key(attributes, "government.identifier")
          - delete_key(attributes, "payment.card.number")
          - delete_key(attributes, "bank.account.number")
          - delete_key(attributes, "broker.api_secret")
          - delete_key(attributes, "broker.signing_key")
          - delete_key(attributes, "trade.authorization")
          - set(body, "[REDACTED: message body suppressed]") where IsString(body) and IsMatch(body, "(?i)(authorization|password|access[_-]?token|refresh[_-]?token|api[_-]?key|private[_-]?key|card[_-]?number|bank[_-]?account|broker[_-]?(secret|key))")
    metric_statements:
      - context: datapoint
        statements:
          - delete_key(attributes, "tenant_id")
          - delete_key(attributes, "customer_id")
          - delete_key(attributes, "user_id")
          - delete_key(attributes, "email")
          - delete_key(attributes, "phone")
          - delete_key(attributes, "request_id")
          - delete_key(attributes, "correlation_id")
          - delete_key(attributes, "trace_id")
          - delete_key(attributes, "session_id")
          - delete_key(attributes, "message_id")
          - delete_key(attributes, "order_id")
          - delete_key(attributes, "payment_id")
          - delete_key(attributes, "trade_id")
      - context: histogram
        statements:
          - delete_key(attributes, "tenant_id")
          - delete_key(attributes, "customer_id")
          - delete_key(attributes, "user_id")
          - delete_key(attributes, "email")
          - delete_key(attributes, "phone")
          - delete_key(attributes, "request_id")
          - delete_key(attributes, "correlation_id")
          - delete_key(attributes, "trace_id")
          - delete_key(attributes, "session_id")
          - delete_key(attributes, "message_id")
          - delete_key(attributes, "order_id")
          - delete_key(attributes, "payment_id")
          - delete_key(attributes, "trade_id")
