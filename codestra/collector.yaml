extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        max_recv_msg_size_mib: 16
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 15

  resource/codestra:
    attributes:
      - pattern: '(?i)^(tenant(\.id|_id|\.name|_name)|organization(\.id|_id|\.name|_name)|customer(\.id|_id|\.name|_name)|account(\.id|_id)|user(\.id|_id|\.name|_name)|email|phone|token|secret|password|session(\.id|_id)|request(\.id|_id)|correlation(\.id|_id)|trace(\.id|_id)|span(\.id|_id)|lead(\.id|_id)|order(\.id|_id)|message(\.id|_id)|workflow(\.id|_id)|execution(\.id|_id)|webhook(\.id|_id)|idempotency(\.key|_key)|url\.full|http\.target|http\.url|db\.statement|process\.command_line|service\.instance\.id|host\.id|container\.id)$'
        action: delete
      - key: codestra.platform
        value: codestra
        action: upsert
      - key: deployment.environment.name
        value: ${env:CODESTRA_ENVIRONMENT}
        action: upsert
      - key: codestra.region
        value: ${env:CODESTRA_REGION}
        action: upsert
      - key: codestra.tenant_scope
        value: aggregate
        action: upsert

  attributes/tenant_safe:
    actions:
      - pattern: '(?i)^(tenant(\.id|_id|\.name|_name)|organization(\.id|_id|\.name|_name)|customer(\.id|_id|\.name|_name)|account(\.id|_id)|user(\.id|_id|\.name|_name)|email|phone|token|secret|password|session(\.id|_id)|request(\.id|_id)|correlation(\.id|_id)|trace(\.id|_id)|span(\.id|_id)|lead(\.id|_id)|order(\.id|_id)|message(\.id|_id)|workflow(\.id|_id)|execution(\.id|_id)|webhook(\.id|_id)|idempotency(\.key|_key)|raw_path|path|uri|url|query|query_string|client\.address|network\.peer\.address|db\.statement)$'
        action: delete
      - key: tenant_scope
        value: aggregate
        action: upsert

  transform/canonical_metrics:
    error_mode: propagate
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["application"], resource.attributes["codestra.application"]) where resource.attributes["codestra.application"] != nil
          - set(attributes["service"], resource.attributes["service.name"]) where resource.attributes["service.name"] != nil
          - set(attributes["environment"], resource.attributes["deployment.environment.name"]) where resource.attributes["deployment.environment.name"] != nil
          - set(attributes["server"], resource.attributes["host.name"]) where resource.attributes["host.name"] != nil
          - set(attributes["tenant_scope"], "aggregate")

  batch:
    timeout: 5s
    send_batch_size: 8192
    send_batch_max_size: 16384

exporters:
  prometheus/application_metrics:
    endpoint: 0.0.0.0:8889
    send_timestamps: false
    metric_expiration: 5m
    enable_open_metrics: true
    without_scope_info: true
    translation_strategy: UnderscoreEscapingWithSuffixes
    resource_to_telemetry_conversion:
      enabled: false

  otlp/tempo:
    endpoint: ${env:TEMPO_OTLP_GRPC_ENDPOINT}
    tls:
      insecure: ${env:TEMPO_OTLP_INSECURE}
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2048
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

  otlphttp/loki:
    endpoint: ${env:LOKI_OTLP_HTTP_ENDPOINT}
    tls:
      insecure: ${env:LOKI_OTLP_INSECURE}
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 2048
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

service:
  extensions:
    - health_check
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/codestra, attributes/tenant_safe, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource/codestra, attributes/tenant_safe, transform/canonical_metrics, batch]
      exporters: [prometheus/application_metrics]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/codestra, attributes/tenant_safe, batch]
      exporters: [otlphttp/loki]
  telemetry:
    resource:
      platform: codestra
      environment: ${env:CODESTRA_ENVIRONMENT}
      server: ${env:CODESTRA_SERVER}
      application: observability
      service: opentelemetry-collector
      tenant_scope: aggregate
    logs:
      level: info
      encoding: json
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
                with_resource_constant_labels:
                  included:
                    - platform
                    - environment
                    - server
                    - application
                    - service
                    - tenant_scope
